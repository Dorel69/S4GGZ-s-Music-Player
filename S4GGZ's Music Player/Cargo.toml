[package]
name = "aura-player-native"
version = "0.2.0"
description = "S4GGZ - native desktop music library and audio player, no WebView"
authors = ["S4GGZ"]
edition = "2021"
rust-version = "1.95"

[[bin]]
name = "s4ggz"
path = "src/main.rs"

[dependencies]
eframe = "=0.36.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
egui_extras = "=0.36.2"
rodio = { version = "0.21", features = ["symphonia-all"] }
lofty = "0.25"
rusqlite = { version = "0.37", features = ["bundled", "collation", "functions", "backup"] }
rayon = "1.10"
walkdir = "2.5"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
